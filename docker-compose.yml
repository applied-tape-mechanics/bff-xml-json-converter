services:
  xml-json-converter:
    image: ghcr.io/applied-tape-mechanics/bff-xml-json-converter:latest
    build:
      context: .
      target: production
    container_name: bff-xml-json-converter
    ports:
      - "8003:8000"
    environment:
      - NODE_ENV=production
      # Set to 'true' to disable the backend API and test pure client-side JavaScript VM execution
      # - DISABLE_BACKEND=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  healthcheck:
    image: ghcr.io/applied-tape-mechanics/bff-container-health-check:latest
    container_name: bff-xml-json-converter-healthcheck
    ports:
      - "8084:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    container_name: bff-xml-json-converter-test
    profiles:
      - test
    command: npm test
